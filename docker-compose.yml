services:
  chat-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-chat:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_START_COMMAND: "uvicorn app.main:app --host 0.0.0.0 --port 8443 --ssl-keyfile /opt/crypto-chat/certs/server.key.pem --ssl-certfile /opt/crypto-chat/certs/server-chain.pem"
      HOST: "0.0.0.0"
      PORT: "8443"
    ports:
      - "8443:8443"
    volumes:
      - ./data:/opt/crypto-chat/data
      - ./logs:/opt/crypto-chat/logs
      - ./backups:/opt/crypto-chat/backups
      - ./certs:/opt/crypto-chat/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('PORT','8443'))), 2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
